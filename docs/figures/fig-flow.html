<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">

@page { size: 520px 720px; margin: 0; }
*{margin:0;padding:0;box-sizing:border-box} body{background:#ffffff;color:#111111;font-family:'Geist',system-ui,sans-serif}
.diagram-container{width:520px;overflow-x:auto} svg{display:block;min-width:520px}
.tag{font:500 8px 'Geist Mono',monospace;letter-spacing:.12em;fill:#555555}

</style></head><body><div class="diagram-container"><svg viewBox="0 0 520 720" width="520" height="720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-flow-title fig-flow-desc"><title id="fig-flow-title">Analysis pipeline for one recording</title><desc id="fig-flow-desc">One recording is decoded, checked, filtered, screened by an out-of-distribution gate, windowed, scored by the model heads and merged into a report, or rejected with a reason.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#333333"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><path d="M 160 80 L 160 112" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M 160 168 L 160 200" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M 160 256 L 160 286" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M 160 374 L 160 416" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M 160 472 L 160 504" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M 160 560 L 160 592" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M 260 140 L 292 140 Q 300 140 300 148 L 300 212 Q 300 220 308 220 L 330 220" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M 240 330 L 304 330 Q 312 330 312 322 L 312 244 Q 312 236 320 236 L 330 236" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="60" y="24" width="200" height="56" rx="6" fill="#ffffff"/><rect x="60" y="24" width="200" height="56" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.2"/><text x="70" y="38" class="tag">INPUT</text><text x="160.0" y="54.0" class="name" text-anchor="middle">Upload or record</text><text x="160.0" y="70.0" class="sub" text-anchor="middle">wav · m4a · mp3</text><rect x="60" y="112" width="200" height="56" rx="6" fill="#ffffff"/><rect x="60" y="112" width="200" height="56" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.2"/><text x="70" y="126" class="tag">CHECK</text><text x="160.0" y="142.0" class="name" text-anchor="middle">Decode and validate</text><text x="160.0" y="158.0" class="sub" text-anchor="middle">2-120 s · not clipped</text><rect x="60" y="200" width="200" height="56" rx="6" fill="#ffffff"/><rect x="60" y="200" width="200" height="56" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.2"/><text x="70" y="214" class="tag">DSP</text><text x="160.0" y="230.0" class="name" text-anchor="middle">Filter and resample</text><text x="160.0" y="246.0" class="sub" text-anchor="middle">4 kHz · band-pass</text><polygon points="160,286 240,330 160,374 80,330" fill="#ffffff" stroke="#111111" stroke-width="1.2"/><text x="160" y="328" class="name" text-anchor="middle">Stethoscope-like?</text><text x="160" y="343" class="sub" text-anchor="middle">IsolationForest</text><rect x="60" y="416" width="200" height="56" rx="6" fill="#ffffff"/><rect x="60" y="416" width="200" height="56" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.2"/><text x="70" y="430" class="tag">DSP</text><text x="160.0" y="446.0" class="name" text-anchor="middle">Cut windows</text><text x="160.0" y="462.0" class="sub" text-anchor="middle">heart 5 s · lung 3 or 8 s</text><rect x="60" y="504" width="200" height="56" rx="6" fill="#ffffff"/><rect x="60" y="504" width="200" height="56" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.2"/><text x="70" y="518" class="tag">ML</text><text x="160.0" y="534.0" class="name" text-anchor="middle">Model heads</text><text x="160.0" y="550.0" class="sub" text-anchor="middle">LightGBM x 5</text><rect x="60" y="592" width="200" height="56" rx="6" fill="#ffffff"/><rect x="60" y="592" width="200" height="56" rx="6" fill="#e4e4e4" stroke="#111111" stroke-width="2.2"/><text x="70" y="606" class="tag">OUTPUT</text><text x="160.0" y="622.0" class="name" text-anchor="middle">Fused report</text><text x="160.0" y="638.0" class="sub" text-anchor="middle">status · flags · conf.</text><rect x="330" y="200" width="160" height="56" rx="6" fill="#ffffff"/><rect x="330" y="200" width="160" height="56" rx="6" fill="#f0f0f0" stroke="#111111" stroke-width="1.2"/><text x="340" y="214" class="tag">STOP</text><text x="410.0" y="230.0" class="name" text-anchor="middle">Reject with reason</text><text x="410.0" y="246.0" class="sub" text-anchor="middle">ask to re-record</text><rect x="308.2" y="172" width="35.6" height="16" fill="#ffffff"/><text x="326" y="183" class="lab" text-anchor="middle">FAIL</text><rect x="264.1" y="308" width="23.8" height="16" fill="#ffffff"/><text x="276" y="319" class="lab" text-anchor="middle">NO</text><rect x="171.15" y="387" width="29.7" height="16" fill="#ffffff"/><text x="186" y="398" class="lab" text-anchor="middle">YES</text><line x1="40" y1="676" x2="480" y2="676" stroke="#bbbbbb" stroke-width="0.8"/><rect x="40" y="690" width="22" height="14" rx="3" fill="#e4e4e4" stroke="#111111" stroke-width="2.2"/><text x="70" y="701" class="leg">result shown to user</text><rect x="210" y="690" width="22" height="14" rx="3" fill="#f0f0f0" stroke="#111111" stroke-width="1.2"/><text x="240" y="701" class="leg">request stops</text></svg></div></body></html>
